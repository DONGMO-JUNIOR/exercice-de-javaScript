<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="exo2.js"></script>
    <title>Calcul des jours jusqu'à Noël</title>
</head>
<body>
    <h1>Calcul des jours jusqu'à Noël</h1>
    <h2> Entrer vos données</h2>
    <label for="jour">Jour (JJ) :</label>
    <input type="number" id="jour" min="1" max="31"><br>
    <label for="mois">Mois (MM) :</label>
    <input type="number" id="mois" min="1" max="12"><br>
    <label for="annee">Année (AAAA) :</label>
    <input type="number" id="annee" min="2000"><br>

    <button onclick="calculer()">Calculer</button>
    <p id="resultat"></p>

</body>
</html>
